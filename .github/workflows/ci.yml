name: ci
on:
  push:
  pull_request:

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint chart
      - name: helm template (defaults and overrides)
        run: |
          helm template demo chart > /dev/null
          helm template demo chart --set replicaCount=3 --set config.appName=x --set config.version=9 > /dev/null

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t demo-app:ci ./service
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-app:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
